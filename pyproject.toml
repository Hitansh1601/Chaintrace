[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaintrace"
version = "0.1.0"
description = "Read-only blockchain transaction investigation and evidence-reporting toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35",
    "pandas>=2.1",
    "networkx>=3.2",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chaintrace = "chaintrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaintrace = ["sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
